[project]
name = "mlx-server-utils"
version = "0.1.0"
description = "A collection of wrappers for local mlx-lm model inference."
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "mlx>=0.32.0",
    "mlx-lm>=0.31.3",
    "transformers>=5.14.1",
    "torch>=2.1.0",
]

[project.scripts]
start-inference-server = "app.server:main"
start-context-server = "app.context_server:main"
manage-model-sources = "app.manage:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
